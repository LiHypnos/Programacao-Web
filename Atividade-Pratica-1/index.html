<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance-Click</title>
</head>
<body>
    <select id="songSelector"></select>
    <button id="startG" onclick="startGame()">!PLAY!</button>
    <div class="game">
        <div class="column" data-key="a"></div>
        <div class="column" data-key="s"></div>
        <div class="column" data-key="d"></div>
        <div class="column" data-key="f"></div>
    </div>
</body>
</html>
